spring.application.name=fm-locacao-backend

# Conexão com o Banco de Dados
spring.datasource.url=jdbc:mysql://localhost:3306/fm_locacao_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root

# Senha do meu banco local
spring.datasource.password=root


# Configurações do Hibernate (Para criar tabelas sozinho)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect